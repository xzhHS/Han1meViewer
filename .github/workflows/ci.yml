name: Build APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create placeholder google-services.json
        run: |
          cat > app/google-services.json << 'JSONEOF'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "placeholder"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.yenaly.han1meviewer"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "PLACEHOLDER"}],
                "services": {"analytics_service": {"status": 2}}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.yenaly.han1meviewer.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "PLACEHOLDER"}],
                "services": {"analytics_service": {"status": 2}}
              }
            ]
          }
          JSONEOF

      - name: Override with real Google Services file (if secret is set)
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$DATA" ]; then
            echo "$DATA" | base64 -di > app/google-services.json
            echo "Using real Google Services file from secret"
          else
            echo "No Google Services secret found, using placeholder"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.YOUR_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/keystore.jks"

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA1_VERSION_SOURCE: 'ci'

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Han1meViewer-release
          path: app/build/outputs/apk/release/*.apk
