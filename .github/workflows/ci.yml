name: Build APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Load Google Services File
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo $DATA | base64 -di > app/google-services.json

      - name: Create placeholder google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 == '' }}
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "placeholder",
              "storage_bucket": "placeholder"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.yenaly.han1meviewer"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "PLACEHOLDER_API_KEY"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 2
                  },
                  "appinvite_service": {
                    "status": 2
                  },
                  "ads_service": {
                    "status": 2
                  }
                }
              }
            ]
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug
        env:
          HA1_VERSION_SOURCE: 'ci'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Han1meViewer-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
